name: Texas Show Locator Scraper

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TCDB scraper
        run: python scrape_tcdb.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previous_snapshot.csv
          git diff --cached --quiet || git commit -m "Update TCDB event snapshot"
          git push

      - name: Upload CSV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-show-locator-reports
          path: |
            output/texas_card_shows.csv
            output/daily_changes.csv
            output/scrape_audit.txt
          if-no-files-found: warn
          retention-days: 30
