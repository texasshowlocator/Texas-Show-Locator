name: TCG Shows Near Me Scraper

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run TCG Shows Near Me scraper
        run: python scrape_tcgshowsnearme.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tcgshowsnearme_previous_snapshot.csv
          git diff --cached --quiet || git commit -m "Update TCG Shows Near Me event snapshot"
          git push

      - name: Upload CSV reports and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcgshowsnearme-texas-reports
          path: |
            output/tcgshowsnearme_events.csv
            output/tcgshowsnearme_daily_changes.csv
            output/tcgshowsnearme_scrape_audit.txt
          if-no-files-found: warn
          retention-days: 30
