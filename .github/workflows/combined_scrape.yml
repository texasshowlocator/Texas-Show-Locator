name: Combined Texas Show Locator Report

on:
  schedule:
    # GitHub cron uses UTC. Trigger at both possible 7 PM Central UTC offsets,
    # then run the scraper job only when the Chicago local hour is 19.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combined-texas-show-report
  cancel-in-progress: false

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.local-time.outputs.should_run }}
    steps:
      - name: Check Central time
        id: local-time
        run: |
          CENTRAL_HOUR="$(TZ=America/Chicago date +'%H')"
          if [ "$CENTRAL_HOUR" = "19" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape-and-combine:
    needs: schedule-check
    if: ${{ github.event_name == 'workflow_dispatch' || needs.schedule-check.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run TCDB scraper
        run: python scrape_tcdb.py

      - name: Run OnTreasure scraper
        run: python scrape_ontreasure.py

      - name: Build combined CSV report
        run: python combine_scraper_reports.py

      - name: Commit updated source snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previous_snapshot.csv data/ontreasure_previous_snapshot.csv
          git diff --cached --quiet || git commit -m "Update TCDB and OnTreasure event snapshots"
          git push

      - name: Upload combined and individual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-show-locator-combined-reports
          path: |
            output/combined_texas_card_shows.csv
            output/texas_card_shows.csv
            output/ontreasure_events.csv
            output/daily_changes.csv
            output/ontreasure_daily_changes.csv
            output/scrape_audit.txt
            output/ontreasure_scrape_audit.txt
          if-no-files-found: warn
          retention-days: 30
