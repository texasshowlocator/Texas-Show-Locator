name: OnTreasure Texas Events Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run OnTreasure scraper
        run: python scrape_ontreasure.py

      - name: Commit updated OnTreasure snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ontreasure_previous_snapshot.csv
          git diff --cached --quiet || git commit -m "Update OnTreasure event snapshot"
          git push

      - name: Upload OnTreasure CSV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontreasure-texas-event-reports
          path: |
            output/ontreasure_events.csv
            output/ontreasure_daily_changes.csv
            output/ontreasure_scrape_audit.txt
          if-no-files-found: warn
          retention-days: 30
